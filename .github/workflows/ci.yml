name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Validate OpenAPI
        run: npx -y @redocly/cli@2.46.0 lint api/openapi.yaml --format stylish
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit and race tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Security release gates
        run: go test ./internal/strategy/formation ./internal/adapters/sqlite -run '^TestSecurityGate' -v
      - name: Deterministic benchmark
        run: |
          go run ./cmd/memxplore benchmark internal \
            --output "$RUNNER_TEMP/memxplore-runs" \
            --run-id ci-internal-lifecycle \
            --seed 1
          go run ./cmd/memxplore eval verify \
            --run "$RUNNER_TEMP/memxplore-runs/ci-internal-lifecycle"
      - name: Upload deterministic benchmark
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/memxplore-runs/ci-internal-lifecycle
          if-no-files-found: error
          retention-days: 14

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/memxplore
